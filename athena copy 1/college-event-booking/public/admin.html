<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Athena Fest 2025</title>
    <style>
        :root { --primary: #6c5ce7; --bg: #f8f9fa; --text: #2d3436; --border: #dfe6e9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg); color: var(--text); }
        header { background: #2d3436; color: white; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.5rem; }
        .stat-badge { background: var(--primary); padding: 0.5rem 1rem; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        .table-container { background: white; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
        th { background-color: #f1f2f6; color: #636e72; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        tr:hover { background-color: #f8f9fa; }
        .txn-id { font-family: monospace; color: var(--primary); font-weight: bold; }
        .empty-state { text-align: center; padding: 3rem; color: #b2bec3; }
    </style>
</head>
<body>
    <header>
        <h1>Admin Dashboard - Event Bookings</h1>
        <div class="stat-badge">Total Passes Sold: <span id="totalPasses">0</span></div>
    </header>
    <div class="container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Student Name</th>
                        <th>College</th>
                        <th>Course</th>
                        <th>Mobile</th>
                        <th>Passes</th>
                        <th>Payment ID</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="7" class="empty-state">Loading records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        async function loadBookings() {
            try {
                const response = await fetch('/api/bookings');
                const bookings = await response.json();
                
                const tbody = document.getElementById('tableBody');
                const totalPassesElement = document.getElementById('totalPasses');
                
                if (bookings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No bookings found yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                let totalPasses = 0;

                bookings.reverse().forEach(booking => {
                    totalPasses += parseInt(booking.passes);
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${booking.date}</td>
                        <td><strong>${booking.name}</strong></td>
                        <td>${booking.college}</td>
                        <td>${booking.course}</td>
                        <td>${booking.mobile}</td>
                        <td>${booking.passes}</td>
                        <td class="txn-id">${booking.id}</td>
                    `;
                    tbody.appendChild(row);
                });

                totalPassesElement.innerText = totalPasses;

            } catch (error) {
                console.error('Error fetching bookings:', error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty-state" style="color: red;">Failed to load data. Is the server running?</td></tr>';
            }
        }
        loadBookings();
    </script>
</body>
</html>
